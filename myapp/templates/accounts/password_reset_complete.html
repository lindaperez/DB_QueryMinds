{% extends "layouts/base-auth.html" %}
{% load static %}

{% block title %}Password Reset Complete{% endblock title %}

{% block content %}

  <div class="auth-main">
    <div class="auth-wrapper v1">
      <div class="auth-form">
        <div class="position-relative my-5">
          <div class="auth-bg">
            <span class="r"></span>
            <span class="r s"></span>
            <span class="r s"></span>
            <span class="r"></span>
          </div>
          <div class="card mb-0">
            <div class="card-body text-center">
              <div class="queryminds-logo">
                <span class="qm-highlight">Query</span>Minds
              </div>
              <style>
                .queryminds-logo {
                  font-size: 2.3rem;
                  font-weight: 700;
                  font-family: 'Poppins', sans-serif;
                  color: #1e293b;
                  letter-spacing: 1px;
                  display: inline-block;
                  padding: 8px 16px;
                  border-radius: 12px;
                  background: linear-gradient(90deg, #f0fdfa, #ecfeff);
                  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
                }
                .qm-highlight { color: #14b8a6; }
              </style>

              <h4 class="f-w-500 mt-4 mb-3">Password Reset Complete</h4>
              <p class="text-muted mb-4">
                Your password has been set successfully. You can now sign in with your
                new password.
              </p>

              <a href="{% url "login" %}" class="btn btn-primary shadow px-sm-4">Go to Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

{% endblock content %}
